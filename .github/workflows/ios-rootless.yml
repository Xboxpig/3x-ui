name: Build rootless iOS package

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.4'
          cache: true

      - name: Install Debian package tools
        run: brew install dpkg

      - name: Build package
        run: |
          chmod +x ios/build.sh ios/fetch-assets.sh ios/package.sh
          ios/fetch-assets.sh
          ios/build.sh
          ios/package.sh

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: 3x-ui-ios16-rootless
          path: ios/build/*.deb
          if-no-files-found: error
